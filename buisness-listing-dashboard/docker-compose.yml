# ============================================================
# docker-compose.yml
# Runs: MySQL 8.0 (required) + Adminer (optional UI)
# The FastAPI backend and React frontend run on the HOST.
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # MySQL 8.0
  # ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: listings_mysql
    restart: unless-stopped

    # Force utf8mb4 at the server level so every connection inherits it
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

    ports:
      - "${DB_PORT:-3306}:3306"          # host port : container port

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE:      "${DB_NAME}"
      MYSQL_USER:          "${DB_USER}"
      MYSQL_PASSWORD:      "${DB_PASSWORD}"

    volumes:
      # Named volume keeps data between container restarts
      - mysql_data:/var/lib/mysql
      # schema.sql is auto-executed on first container start only
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h", "localhost",
          "-u", "root",
          "--password=${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # Adminer – lightweight web UI to inspect the database
  # Visit http://localhost:8080  (optional; comment out if unwanted)
  # ──────────────────────────────────────────────────────────
  adminer:
    image: adminer
    container_name: listings_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
