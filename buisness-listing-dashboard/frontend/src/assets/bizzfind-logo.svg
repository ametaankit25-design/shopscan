<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#992636" />
      <stop offset="60%" stop-color="#7a1f2b" />
      <stop offset="100%" stop-color="#4f111a" />
    </linearGradient>
    <linearGradient id="bf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="bf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bf-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Main Pin Marker -->
  <g filter="url(#bf-shadow)">
    <!-- White Map Pin -->
    <path
      d="M32 9.5 C22.8 9.5 15.5 16.8 15.5 26 C15.5 38.2 29.8 49.8 31.1 50.8 C31.6 51.2 32.4 51.2 32.9 50.8 C34.2 49.8 48.5 38.2 48.5 26 C48.5 16.8 41.2 9.5 32 9.5 Z"
      fill="#ffffff"
    />

    <!-- Inner Wine Circle -->
    <circle cx="32" cy="25" r="9.5" fill="url(#bf-bg)" />

    <!-- Bold "B" Monogram -->
    <path
      d="M28.5 20 H32.8 C34.3 20 35.4 20.8 35.4 22.1 C35.4 23.1 34.7 23.8 33.7 24.1 C35.0 24.4 36.0 25.4 36.0 26.9 C36.0 28.5 34.6 29.6 32.9 29.6 H28.5 V20 Z M30.6 21.6 V23.7 H32.7 C33.4 23.7 33.8 23.3 33.8 22.7 C33.8 22.0 33.4 21.6 32.7 21.6 H30.6 Z M30.6 25.3 V27.9 H32.9 C33.7 27.9 34.2 27.4 34.2 26.6 C34.2 25.8 33.7 25.3 32.9 25.3 H30.6 Z"
      fill="#ffffff"
    />
  </g>

  <!-- Golden Discovery Star on Pin Shoulder -->
  <path
    d="M48 11.5 L49.2 14.5 L52.2 15.7 L49.2 16.9 L48 19.9 L46.8 16.9 L43.8 15.7 L46.8 14.5 Z"
    fill="url(#bf-gold)"
  />
  <circle cx="48" cy="15.7" r="1.2" fill="#ffffff" />
</svg>
