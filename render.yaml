services:
  - type: web
    name: bizzfind-backend
    runtime: python
    rootDir: buisness-listing-dashboard/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4

